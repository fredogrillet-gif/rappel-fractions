<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les fractions – rappel CM2 | Le Labo des Savoirs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2A44; --lime:#8DC63F; --blue:#1E88C8; --orange:#F5A623; --red:#D8432B; --green:#2F8F46; --purple:#6C4AB6;
  --blue-t:#E8F4FB; --green-t:#E6F3D3; --orange-t:#FEF1D6;
  --s:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#EAF2F8;font-family:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;color:var(--navy);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;background:#fff;transform:translate(-50%,-50%) scale(var(--s));transform-origin:center center;overflow:hidden;box-shadow:0 10px 40px rgba(31,42,68,.18);border-radius:6px}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ---------- en-tête ---------- */
#tag{position:absolute;left:60px;top:28px;padding:6px 22px;border-radius:30px;font-weight:900;font-size:20px;letter-spacing:1.5px;color:#fff;background:var(--blue)}
#tag.R{background:var(--orange);color:var(--navy)}
#tag.C{background:var(--green)}
#title{position:absolute;left:60px;top:72px;margin:0;font-size:44px;font-weight:900;line-height:1.1;width:900px}
#logo-sm{position:absolute;right:50px;top:14px;width:118px;height:118px;object-fit:contain}
#tools{position:absolute;right:182px;top:34px;display:flex;gap:10px;align-items:center}
#tools button{width:46px;height:46px;border-radius:50%;border:3px solid var(--navy);background:#fff;font-size:22px;font-weight:900;color:var(--navy)}
#tools button:hover{background:var(--blue-t)}
#counter{font-weight:800;font-size:20px;margin-right:6px;opacity:.7}

/* ---------- carte ---------- */
#card{position:absolute;left:60px;top:150px;width:800px;height:480px;border-radius:24px;padding:22px 28px;overflow:hidden;background:var(--blue-t);display:flex;flex-direction:column;gap:12px;animation:pop .35s ease}
#card.C{background:var(--green-t);justify-content:center}
#card.I{background:#F3F7FB}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q{margin:0;font-size:26px;font-weight:800;line-height:1.25}
.q.small{font-size:23px}
.note{font-size:23px;font-weight:700;line-height:1.3;margin:0}
.center{display:flex;justify-content:center;align-items:center}
.row{display:flex;align-items:center;gap:16px}
.red{color:var(--red)} .blue{color:var(--blue)} .gr{color:var(--green)} .or{color:#C77A00}
b.red,b.blue{font-weight:900}

/* ---------- bandes, grilles ---------- */
.bar{display:flex;border:4px solid var(--navy);border-radius:8px;overflow:hidden;background:#fff}
.bar .cell{flex:1;border-right:3px solid var(--navy);transition:background .15s}
.bar .cell:last-child{border-right:0}
.bar .cell.on{background:var(--orange)}
.bar .cell.on.red{background:var(--red)}
.bar.click .cell{cursor:pointer}
.bar.click .cell:hover{background:#FFE3A3}
.bar.click .cell.on:hover{background:#E69500}
.grid{display:grid;border:4px solid var(--navy);background:#fff}
.grid .cell{border:2px solid var(--navy);cursor:pointer;transition:background .15s}
.grid .cell.l{background:var(--blue)} .grid .cell.m{background:var(--orange)}
.static .cell{cursor:default}

/* ---------- fractions ---------- */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:900;line-height:1.05}
.frac .n,.frac .d{padding:0 8px;display:block;text-align:center}
.frac .n{color:var(--red);border-bottom:4px solid var(--navy)}
.frac .d{color:var(--blue)}
.frac.s{font-size:30px} .frac.m{font-size:40px} .frac.l{font-size:54px}
.frac.k .n,.frac.k .d{color:var(--navy)}
input.num{width:84px;height:58px;font-size:36px;font-weight:900;text-align:center;border:4px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);outline:none;margin:3px 0}
input.num:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,136,200,.25)}
input.num.sm{width:70px;height:50px;font-size:30px}
input.num.ok,.zone.ok,.sym.ok{border-color:var(--green)!important;background:#DDF3DF!important}
input.num.ko,.zone.ko,.sym.ko{border-color:var(--red)!important;background:#FBE0DB!important;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sym{width:92px;height:74px;font-size:46px;font-weight:900;border:4px dashed var(--orange);border-radius:50%;background:#fff;color:var(--navy)}
.sym.set{border-style:solid;color:var(--red)}
.sym:hover{background:var(--orange-t)}

/* ---------- glisser-déposer ---------- */
.bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:62px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.65)}
.chip{padding:8px 18px;background:#fff;border:4px solid var(--blue);border-radius:14px;font-size:26px;font-weight:900;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 rgba(31,42,68,.2);transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--orange-t);border-color:var(--orange);transform:translateY(-3px) scale(1.05)}
.chip.dragging{opacity:.25}
.chip.ghost{position:absolute;z-index:999;pointer-events:none;transform:scale(1.1) rotate(-3deg);box-shadow:0 12px 20px rgba(31,42,68,.3);opacity:.95}
.chip .frac{font-size:26px}
.zone{display:inline-flex;align-items:center;justify-content:center;min-width:150px;min-height:62px;border:4px dashed #7C97B0;border-radius:14px;background:rgba(255,255,255,.7);padding:2px;transition:background .15s}
.zone:empty::before{content:attr(data-ph);font-size:20px;font-weight:700;color:#7C97B0}
.zone.over{background:#FFF3CC;border-color:var(--orange)}
.zone .chip{box-shadow:none;border-color:var(--navy)}
.locked .chip{cursor:default}
.fixed-label{display:inline-block;padding:8px 18px;border-radius:14px;font-size:26px;font-weight:900;background:#fff;border:4px solid var(--navy)}

/* ---------- bille / divers ---------- */
.balls{display:grid;grid-template-columns:repeat(5,62px);gap:10px}
.ball{width:62px;height:62px;border-radius:50%;border:4px solid var(--navy);background:#fff;cursor:pointer;transition:background .15s,transform .1s}
.ball:hover{transform:scale(1.08)}
.ball.on{background:var(--red)}
.static .ball{cursor:default}.static .ball:hover{transform:none}
.eq{font-size:46px;font-weight:900;display:inline-block;margin:0 6px}
.badge{display:inline-block;padding:2px 12px;border-radius:10px;font-weight:900;color:#fff}
.badge.red{background:var(--red);color:#fff}.badge.blue{background:var(--blue);color:#fff}
.lines p{margin:6px 0;font-size:25px;font-weight:700}
.lines p.big{font-size:30px;font-weight:900}
.reveal{animation:pop .5s ease both}

/* ---------- barre du bas ---------- */
#foot{position:absolute;left:60px;top:646px;width:800px;height:56px;display:flex;gap:14px;align-items:center}
#foot button{height:54px;border-radius:30px;border:0;font-size:22px;font-weight:900;padding:0 26px;color:#fff;background:var(--navy);box-shadow:0 4px 0 rgba(0,0,0,.25)}
#foot button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#foot button:disabled{opacity:.35;cursor:default}
#btn-check{background:var(--green)!important;flex:1;font-size:25px!important}
#btn-reset{background:#fff!important;color:var(--navy)!important;border:3px solid var(--navy)!important;box-shadow:none!important;width:54px;padding:0!important;font-size:26px!important}
#btn-next.pulse{animation:pulse 1s infinite;background:var(--orange)!important;color:var(--navy)!important}
@keyframes pulse{50%{transform:scale(1.07)}}

/* ---------- corbeau et bulle ---------- */
#bubble{position:absolute;right:50px;bottom:402px;width:355px;max-height:210px;background:var(--navy);color:#fff;border-radius:22px;padding:16px 20px;font-size:22px;font-weight:800;line-height:1.25;display:flex;align-items:center;transition:background .2s}
#bubble::after{content:"";position:absolute;right:92px;bottom:-22px;border:14px solid transparent;border-top:24px solid var(--navy);border-bottom:0;transition:border-top-color .2s}
#bubble.happy{background:var(--green)} #bubble.happy::after{border-top-color:var(--green)}
#bubble.sad{background:#B8412C} #bubble.sad::after{border-top-color:#B8412C}
#bubble.pop{animation:bpop .4s}
@keyframes bpop{40%{transform:scale(1.06)}}
#crow{position:absolute;right:46px;bottom:0;height:392px;transform:scaleX(-1);transform-origin:center bottom;pointer-events:none}
#crow-wrap{position:absolute;right:0;bottom:0;width:340px;height:392px;pointer-events:none}
#crow-wrap.jump{animation:jump .7s}
@keyframes jump{30%{transform:translateY(-30px)}60%{transform:translateY(0)}80%{transform:translateY(-10px)}}
#crow-wrap.no{animation:nope .5s}
@keyframes nope{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}

/* ---------- écran titre / fin ---------- */
#big{position:absolute;left:0;top:0;width:875px;height:720px;display:none;background:#fff}
#big.on{display:block}
#big img{position:absolute;left:30px;top:100px;width:480px;height:480px;object-fit:contain}
#big h1{position:absolute;left:530px;top:110px;margin:0;font-size:50px;line-height:1.05;font-weight:900;color:var(--green);width:340px}
#big h2{position:absolute;left:530px;top:280px;margin:0;font-size:25px;font-weight:900;color:var(--blue);width:340px}
#big .go{position:absolute;left:530px;top:420px;height:76px;border:0;border-radius:40px;background:var(--orange);color:var(--navy);font-size:32px;font-weight:900;padding:0 34px;box-shadow:0 6px 0 #C77A00}
#big .go:active{transform:translateY(4px);box-shadow:0 2px 0 #C77A00}
#big .score{position:absolute;left:530px;top:290px;width:340px;font-size:28px;font-weight:800}

/* ---------- menu ---------- */
#menu{position:absolute;inset:0;background:rgba(31,42,68,.88);display:none;z-index:2000;padding:70px 120px}
#menu.on{display:block}
#menu h3{color:#fff;font-size:40px;margin:0 0 20px}
#menu .items{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#menu button{background:#fff;border:0;border-radius:14px;padding:14px 18px;font-size:24px;font-weight:800;text-align:left;color:var(--navy)}
#menu button:hover{background:var(--orange-t)}
#menu button.done::after{content:" ★";color:var(--orange)}
#menu .close{position:absolute;right:50px;top:40px;width:56px;height:56px;border-radius:50%;font-size:30px;text-align:center;padding:0}

/* ---------- confettis ---------- */
.confetti{position:absolute;width:14px;height:14px;z-index:1500;pointer-events:none;border-radius:3px;animation:fall 1.4s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <div id="tag"></div>
  <h1 id="title"></h1>
  <div id="tools"><span id="counter"></span><button id="btn-menu" title="Menu (M)">☰</button><button id="btn-full" title="Plein écran (F)">⛶</button></div>
  <img id="logo-sm" alt="Logo Le Labo des Savoirs">
  <div id="card"></div>
  <div id="foot">
    <button id="btn-prev">◀ Précédent</button>
    <button id="btn-check">✔ Vérifier</button>
    <button id="btn-reset" title="Recommencer l'exercice">↺</button>
    <button id="btn-next">Suivant ▶</button>
  </div>
  <div id="big"></div>
  <div id="bubble"></div>
  <div id="crow-wrap"><img id="crow" alt="Le corbeau, mascotte du Labo des Savoirs"></div>
  <div id="menu"></div>
</div>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $('#stage'), card = $('#card'), bubbleEl = $('#bubble'), crowWrap = $('#crow-wrap');
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / 1280, innerHeight / 720);
  stage.style.setProperty('--s', scale);
}
addEventListener('resize', fit); fit();

const frac = (n, d, cls = 's') => `<span class="frac ${cls}"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inp = (ans, cls = '') => `<input class="num ${cls}" inputmode="numeric" maxlength="3" autocomplete="off" data-ans="${ans}">`;
function bar(n, k, w, h, o = {}) {
  let c = '';
  for (let i = 0; i < n; i++) c += `<div class="cell${i < k ? ' on' : ''}${o.red && i < k ? ' red' : ''}"></div>`;
  return `<div class="bar${o.click ? ' click' : ''}${o.click ? '' : ' static'}" data-n="${n}" data-ans="${o.ans ?? ''}" style="width:${w}px;height:${h}px">${c}</div>`;
}

/* ---------- contrôle des champs / zones ---------- */
function checkInputs(root) {
  let good = 0, total = 0;
  $$('input[data-ans]', root).forEach(i => {
    total++;
    const ans = i.dataset.ans.split('|'); const v = i.value.trim().replace(/\s/g, '');
    const ok = ans.includes(v);
    i.classList.toggle('ok', ok); i.classList.toggle('ko', !ok && v !== '');
    if (!ok && v === '') i.classList.add('ko');
    if (ok) good++;
  });
  return { good, total };
}
function checkZones(root) {
  let good = 0, total = 0;
  $$('.zone[data-ans]', root).forEach(z => {
    total++;
    const ch = z.querySelector('.chip');
    const ok = ch && ch.dataset.v === z.dataset.ans;
    z.classList.toggle('ok', !!ok); z.classList.toggle('ko', !ok);
    if (ok) good++;
  });
  return { good, total };
}
function clearMarks(root) { $$('.ok,.ko', root).forEach(e => e.classList.remove('ok', 'ko')); }

/* ---------- glisser-déposer (souris, tactile, ou clic-clic) ---------- */
function makeDnD(root) {
  const bank = $('.bank', root);
  let sel = null;
  const deselect = () => { if (sel) sel.classList.remove('sel'); sel = null; };
  const place = (chip, zone) => {
    const prev = zone.querySelector('.chip');
    if (prev && prev !== chip) bank.appendChild(prev);
    zone.appendChild(chip); clearMarks(root);
  };
  root.addEventListener('pointerdown', e => {
    const chip = e.target.closest('.chip');
    if (!chip || chip.closest('.locked')) return;
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY }; let ghost = null, moved = false;
    const st = stage.getBoundingClientRect();
    const cr = chip.getBoundingClientRect();
    const offX = (e.clientX - cr.left) / scale, offY = (e.clientY - cr.top) / scale;
    const zoneAt = ev => { const t = document.elementFromPoint(ev.clientX, ev.clientY); return t && t.closest('.zone') && root.contains(t) ? t.closest('.zone') : null; };
    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 7) return;
      if (!moved) { moved = true; ghost = chip.cloneNode(true); ghost.classList.add('ghost'); stage.appendChild(ghost); chip.classList.add('dragging'); deselect(); }
      ghost.style.left = ((ev.clientX - st.left) / scale - offX) + 'px';
      ghost.style.top = ((ev.clientY - st.top) / scale - offY) + 'px';
      $$('.zone.over', root).forEach(z => z.classList.remove('over'));
      const z = zoneAt(ev); if (z) z.classList.add('over');
    };
    const up = ev => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      $$('.zone.over', root).forEach(z => z.classList.remove('over'));
      if (moved) {
        ghost.remove(); chip.classList.remove('dragging');
        const z = zoneAt(ev); if (z) place(chip, z); else { bank.appendChild(chip); clearMarks(root); }
      } else {
        const inZone = chip.closest('.zone');
        if (sel && sel !== chip && inZone) { place(sel, inZone); deselect(); }
        else if (sel === chip) deselect();
        else { deselect(); sel = chip; chip.classList.add('sel'); }
      }
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  root.addEventListener('click', e => {
    if (e.target.closest('.chip')) return;
    const z = e.target.closest('.zone');
    if (z && sel) { place(sel, z); deselect(); }
    else if (sel && e.target.closest('.bank')) { bank.appendChild(sel); deselect(); clearMarks(root); }
  });
}
const chips = (arr) => `<div class="bank">${shuffle(arr).map(([v, h]) => `<div class="chip" data-v="${v}">${h ?? v}</div>`).join('')}</div>`;

/* ---------- bandes cliquables ---------- */
function clickableBars(root) {

    c.classList.toggle('on'); clearMarks(root);
  }));
}

/* ---- 4. Droite graduée ---- */
function numberLine(c, solved) {
  const x0 = 76, step = 76, ly = 66;
  let svg = `<svg width="744" height="140" style="position:absolute;left:0;top:0">
    <line x1="${x0 - 20}" y1="${ly}" x2="${x0 + 8 * step + 28}" y2="${ly}" stroke="#1F2A44" stroke-width="5" stroke-linecap="round"/>
    <polygon points="${x0 + 8 * step + 40},${ly} ${x0 + 8 * step + 22},${ly - 11} ${x0 + 8 * step + 22},${ly + 11}" fill="#1F2A44"/>`;
  for (let i = 0; i <= 8; i++) { const big = i % 4 === 0; svg += `<line x1="${x0 + i * step}" y1="${ly - (big ? 22 : 14)}" x2="${x0 + i * step}" y2="${ly + (big ? 22 : 14)}" stroke="#1F2A44" stroke-width="${big ? 5 : 3.5}"/>`; }
  [[3, 'A'], [5, 'B'], [7, 'C']].forEach(([t, L]) => { svg += `<circle cx="${x0 + t * step}" cy="${ly}" r="13" fill="#D8432B" stroke="#fff" stroke-width="3"/><text x="${x0 + t * step}" y="${ly - 28}" text-anchor="middle" font-size="32" font-weight="900" fill="#D8432B" font-family="Nunito,sans-serif">${L}</text>`; });
  [0, 1, 2].forEach(n => svg += `<text x="${x0 + n * 4 * step}" y="${ly + 54}" text-anchor="middle" font-size="30" font-weight="900" fill="#1F2A44" font-family="Nunito,sans-serif">${n}</text>`);
  svg += '</svg>';
  const zones = [[3, '3/4', 3, 4], [5, '5/4', 5, 4], [7, '7/4', 7, 4]].map(([t, v, n, d]) => {
    const left = x0 + t * step - 56;
    return `<div style="position:absolute;left:${left}px;top:146px;width:112px">${solved ? `<div class="center" style="min-height:82px;background:#fff;border:4px solid var(--green);border-radius:14px">${frac(n, d, 's')}</div>` : `<div class="zone" style="min-width:0;width:112px;min-height:82px" data-ans="${v}" data-ph="?"></div>`}</div>`;
  }).join('');
  return `<div style="position:relative;height:240px">${svg}${zones}</div>`;
}

    c.innerHTML = rows.map(([n, d, k], i) => `<div class="row" style="gap:20px;margin-top:${i ? 10 : 4}px"><div style="width:110px" class="center">${n ? frac(1, 2, 'm') : `<span class="frac s"><span class="n">${inp(k, 'sm')}</span><span class="d">${d}</span></span>`}</div>${bar(d, k, 580, 82)}</div>`).join('') +
      `<p class="note" style="margin-top:12px">Que remarques-tu sur la partie coloriée ?</p>`;
    return () => {
      const r = checkInputs(c);
      return r.good === r.total ? { ok: true, msg: "Bravo ! 1/2 = 2/4 = 4/8 : la même partie de l'unité." } : { ok: false, msg: "Compte les parts coloriées de chaque bande. (" + r.good + "/" + r.total + ")" };
    };
  } }, {
  bubble: "Ce sont des fractions égales : elles représentent la même part de l'unité !",
  build(c) {
    c.innerHTML = [[1, 2, 1], [2, 4, 2], [4, 8, 4]].map(([n, d, k], i) => `<div class="row" style="gap:20px;margin-top:${i ? 10 : 4}px"><div style="width:110px" class="center">${frac(n, d, 'm')}</div>${bar(d, k, 580, 82)}</div>`).join('') +
      `<p class="note" style="margin-top:12px">On multiplie le numérateur <b>et</b> le dénominateur par le <b>même nombre</b> : <b>1/2 = 2/4 = 4/8</b>.</p>`;
  } });

/* ---- 8. Fraction d'une quantité ---- */
function balls(red, click) { return `<div class="balls ${click ? '' : 'static'}">${Array.from({ length: 20 }, (_, i) => `<div class="ball${i < red ? ' on' : ''}"></div>`).join('')}</div>`; }
module(8, "Une fraction d'une quantité", {
  bubble: "Partage les 20 billes en groupes égaux. Combien de billes dans 1/4 ?",
  build(c) {
    c.style.flexDirection = 'row'; c.style.gap = '24px'; c.style.alignItems = 'center';
    c.innerHTML = `${balls(0, true)}
      <div style="flex:1">
        <p class="q small">Dans un sac, il y a <b>20 billes</b>.<br>Les <b>3/4</b> sont rouges.</p>
        <div class="lines" style="margin-top:10px">
          <p>1/4 de 20 = ${inp(5, 'sm')} billes</p>
          <p>3/4 de 20 = ${inp(15, 'sm')} billes</p>
        </div>
        <p class="note" style="margin-top:8px;font-size:20px">Tu peux cliquer sur les billes pour t'aider.</p>
      </div>`;
    $$('.ball', c).forEach(b => b.addEventListener('click', () => b.classList.toggle('on')));
    return () => {
      const r = checkInputs(c);
      return r.good === r.total ? { ok: true, msg: "Bravo ! 20 ÷ 4 = 5, puis 5 × 3 = 15 billes rouges." } : { ok: false, msg: "Cherche d'abord 1/4 : partage 20 en 4 groupes égaux. (" + r.good + "/" + r.total + ")" };
    };
  } }, {
  bubble: "Je cherche 1/4 avec une division, puis je multiplie par le numérateur !",
  build(c) {
    c.style.flexDirection = 'row'; c.style.gap = '24px'; c.style.alignItems = 'center';
    c.innerHTML = `${balls(15, false)}
      <div class="lines" style="flex:1">
        <p class="big">1/4 de 20</p><p>20 ÷ 4 = <b class="red">5</b></p>
        <p class="big" style="margin-top:14px">3/4 de 20</p><p>5 × 3 = <b class="red">15</b></p>
        <p class="big gr" style="margin-top:14px">Il y a 15 billes rouges.</p>
      </div>`;
  } });

/* ---- 9. Défi ---- */
function chocoGrid(mode, solved) {
  let cells = '';
  for (let i = 0; i < 12; i++) cells += `<div class="cell ${solved ? (i < 4 ? 'l' : i < 7 ? 'm' : '') : ''}"></div>`;
  return `<div class="grid ${solved ? 'static' : ''}" id="choco" style="grid-template-columns:repeat(6,82px);grid-template-rows:repeat(2,70px)">${cells}</div>`;
}
module(9, 'Le défi du labo', {
  bubble: "Voici un défi ! Pense à 1/3 de 12 et à 1/4 de 12. Tu peux colorier la tablette pour t'aider.",
  build(c) {
    c.innerHTML = `
      <p class="q small">Une tablette de chocolat a 12 carrés. <b class="blue">Léo</b> en mange 1/3, <b class="or">Mia</b> en mange 1/4.</p>
      <div class="center">${chocoGrid('r', false)}</div>
      <div class="row" style="justify-content:center;gap:22px;font-size:24px;font-weight:800;flex-wrap:wrap;margin-top:2px">
        <span><b class="blue">Léo</b> : ${inp(4, 'sm')} carrés</span><span><b class="or">Mia</b> : ${inp(3, 'sm')} carrés</span>
        <span>Reste : <span class="frac s"><span class="n">${inp(5, 'sm')}</span><span class="d">${inp(12, 'sm')}</span></span></span></div>
      <p class="note" style="font-size:19px;text-align:center;margin-top:-2px">Clique sur un carré : 1 clic = Léo (bleu), 2 clics = Mia (orange).</p>`;
    $$('#choco .cell', c).forEach(cell => cell.addEventListener('click', () => {
      if (cell.classList.contains('l')) { cell.classList.replace('l', 'm'); } else if (cell.classList.contains('m')) { cell.classList.remove('m'); } else cell.classList.add('l');
    }));
    return () => {
      const r = checkInputs(c);
      return r.good === r.total ? { ok: true, msg: "Bravo, chercheur ! Il reste 5 carrés sur 12 : 5/12 de la tablette." } : { ok: false, msg: "1/3 de 12 : 12 ÷ 3. 1/4 de 12 : 12 ÷ 4. Puis 12 − 4 − 3. (" + r.good + "/" + r.total + ")" };
    };
  } }, {
  bubble: "Bravo aux chercheurs ! Les 5 carrés qui restent forment 5/12 de la tablette.",
  build(c) {
    c.innerHTML = `
      <p class="q small"><span class="badge blue">Léo = 1/3</span> <span class="badge" style="background:var(--orange);color:var(--navy)">Mia = 1/4</span> Reste = blanc</p>
      <div class="center">${chocoGrid('c', true)}</div>
      <div class="lines"><p>Léo : 12 ÷ 3 = <b class="red">4</b> carrés</p><p>Mia : 12 ÷ 4 = <b class="red">3</b> carrés</p><p class="big">Reste : 12 − 4 − 3 = 5 carrés, soit ${frac(5, 12, 's')}</p></div>`;
  } });

/* ---- bilan + fin ---- */
add({ type: 'I', tag: 'BILAN', title: 'Ce que je retiens', menu: 'Bilan', bubble: "Bravo ! Tu as bien cherché. Relis ces 4 idées avant la prochaine séance.",
  build(c) {
    const cards = [['Une fraction', "Une unité coupée en parts égales : numérateur sur dénominateur.", 'var(--blue)'], ['Je lis', 'Demi, tiers, quart. Ensuite : dénominateur + « ième ».', 'var(--green)'], ['Je compare', 'Même dénominateur : je compare les numérateurs.', 'var(--orange)'], ['Une quantité', '3/4 de 20 : 20 ÷ 4 = 5, puis 5 × 3 = 15.', 'var(--red)']];
    c.style.display = 'grid'; c.style.gridTemplateColumns = '1fr 1fr'; c.style.gap = '14px';
    c.innerHTML = cards.map(([h, t, col], i) => `<div style="background:#fff;border:4px solid ${col};border-radius:18px;padding:14px 18px"><div style="font-size:27px;font-weight:900"><span style="display:inline-block;width:36px;height:36px;border-radius:50%;background:${col};color:${i === 2 ? 'var(--navy)' : '#fff'};text-align:center;line-height:36px;font-size:22px;margin-right:8px">${i + 1}</span>${h}</div><div style="font-size:23px;font-weight:700;line-height:1.25;margin-top:8px">${t}</div></div>`).join('');
  } });
add({ type: 'end', bubble: "Vous êtes de vrais scientifiques des fractions. Bravo à tous !" });

/* =========================================================
   Navigation
   ========================================================= */
let cur = 0, validate = null;
const nextB = $('#btn-next'), prevB = $('#btn-prev'), checkB = $('#btn-check'), resetB = $('#btn-reset');
function resetCard() {
  card.removeAttribute('style'); card.className = '';
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  card.innerHTML = '';
}
function go(i, keepSay) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  const s = slides[cur]; validate = null;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) { }
  $('#counter').textContent = (cur + 1) + ' / ' + slides.length;
  nextB.classList.remove('pulse');
  const big = s.type === 'title' || s.type === 'end';
  $('#big').classList.toggle('on', big);
  ['#tag', '#title', '#card'].forEach(sel => $(sel).style.display = big ? 'none' : '');
  $('#logo-sm').style.display = big ? 'none' : '';
  checkB.style.visibility = resetB.style.visibility = s.type === 'R' ? 'visible' : 'hidden';
  prevB.disabled = cur === 0; nextB.disabled = cur === slides.length - 1;
  nextB.textContent = cur === slides.length - 2 ? 'Fin ▶' : 'Suivant ▶';
  if (big) { renderBig(s); }
  else {
    const t = $('#tag'); t.textContent = s.tag; t.className = s.type;
    $('#title').textContent = s.title;
    resetCard(); card.classList.add(s.type);
    validate = s.build(card) || null;
  }
  if (!keepSay) say(s.bubble);
  const first = $('input.num', card); if (first && s.type === 'R') setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (e) { } }, 50);
}
function renderBig(s) {
  const big = $('#big');
  if (s.type === 'title') {
    big.innerHTML = `<img src="${LOGO_SRC}" alt="Logo Le Labo des Savoirs"><h1>LES FRACTIONS</h1><h2>Séance de rappel · CM2</h2><button class="go" id="go">Commencer ▶</button>`;
    $('#go').onclick = () => go(1);
  } else {
    const nb = Object.keys(MODS).length, ok = Object.values(state.done).filter(Boolean).length;
    big.innerHTML = `<img src="${LOGO_SRC}" alt="Logo Le Labo des Savoirs"><h1 style="font-size:46px">À bientôt au labo !</h1>
      <div class="score">Tu as réussi <b class="gr">${ok}</b> activité${ok > 1 ? 's' : ''} sur ${nb} ${ok === nb ? '🏆' : '⭐'}</div>
      <button class="go" id="again" style="top:440px">↺ Recommencer</button>`;
    $('#again').onclick = () => { state.done = {}; go(0); };
  }
}
function doCheck() {
  if (!validate) return;
  const s = slides[cur]; state.tries[s.mod] = (state.tries[s.mod] || 0) + 1;
  const r = validate();
  if (r.ok) { state.done[s.mod] = true; say(r.msg, 'happy'); confetti(); nextB.classList.add('pulse'); checkB.textContent = '✔ Bravo !'; setTimeout(() => checkB.textContent = '✔ Vérifier', 2500); }
  else say(r.msg, 'sad');
}
checkB.onclick = doCheck;
resetB.onclick = () => go(cur);
nextB.onclick = () => go(cur + 1);
prevB.onclick = () => go(cur - 1);
$('#btn-full').onclick = toggleFull;
function toggleFull() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
function openMenu() {
  const m = $('#menu');
  const items = slides.map((s, i) => ({ s, i })).filter(o => o.s.menu || o.s.type === 'title' || o.s.type === 'end');
  m.innerHTML = '<h3>Aller à…</h3><button class="close" aria-label="Fermer">✕</button><div class="items"></div>';
  const box = $('.items', m);
  items.forEach(({ s, i }) => {
    const b = document.createElement('button');
    b.textContent = s.menu || (s.type === 'title' ? 'Début' : 'Fin');
    if (s.mod && state.done[s.mod]) b.className = 'done';
    b.onclick = () => { m.classList.remove('on'); go(i); };
    box.appendChild(b);
  });
  $('.close', m).onclick = () => m.classList.remove('on');
  m.classList.add('on');
}
$('#btn-menu').onclick = openMenu;
addEventListener('keydown', e => {
  const inField = e.target.matches && e.target.matches('input');
  if (e.key === 'Enter' && inField) { e.preventDefault(); doCheck(); return; }
  if (inField) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') openMenu();
  else if (e.key === 'Escape') $('#menu').classList.remove('on');
});
// filtre les caractères non numériques dans les champs
document.addEventListener('input', e => { if (e.target.matches('input.num')) { e.target.value = e.target.value.replace(/[^0-9]/g, ''); e.target.classList.remove('ok', 'ko'); } });

const start = parseInt((location.hash || '').slice(1), 10);
go(Number.isFinite(start) ? start - 1 : 0);
</script>
</body>
